<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 연습문제1</title>
</head>
<body>
    <h1>회원로그인</h1>
    <form>
        아이디:<input type="text" id="id"><br><br>
        비밀번호:<input type="password" id="pw"><br><br>
        <button onclick="loginCheck()">로그인</button>
    </form>

    <script>
       function loginCheck(){
            const userId=document.getElementById("id").value.trim();
            const userPw =document.getElementById("pw").value.trim();
            
            if(userId==""||userPw==""){
                alert("아이디또는 비밀번호가 공란입니다.");
            }
      
        }

    </script>
    
</body>
</html>
